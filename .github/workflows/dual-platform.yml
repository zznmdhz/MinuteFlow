name: Dual-platform validation and packages
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-version.mjs
      - run: bash scripts/check-regressions.sh
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-package
          path: artifacts/MinuteFlow-*-macOS-universal.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: node scripts/check-version.mjs
      - run: dotnet run --project windows/tests/MinuteFlow.Core.Tests/MinuteFlow.Core.Tests.csproj -c Release
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-package
          path: |
            artifacts/MinuteFlow-*-Windows-win-x64.zip
            artifacts/MinuteFlow-*-Windows-Setup.exe
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macOS-package
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Windows-package
          path: artifacts
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum artifacts/*.zip artifacts/*.exe > artifacts/SHA256SUMS.txt
          notes="docs/release-$GITHUB_REF_NAME.md"
          channel=$(node -p 'JSON.parse(require("fs").readFileSync("version.json")).releaseChannel')
          flags=()
          if [ "$channel" = "preview" ]; then flags+=(--prerelease); fi
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt --title "MinuteFlow $GITHUB_REF_NAME — macOS + Windows" --notes-file "$notes" --verify-tag "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt --title "MinuteFlow $GITHUB_REF_NAME — macOS + Windows" --generate-notes --verify-tag "${flags[@]}"
          fi
