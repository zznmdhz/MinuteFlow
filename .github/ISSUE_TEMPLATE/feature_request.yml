name: Feature request
description: Suggest a focused improvement to MinuteFlow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permission, or compatibility considerations
      description: Note any impact on recordings, credentials, network requests, or macOS permissions.
